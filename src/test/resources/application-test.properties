spring.datasource.url=jdbc:h2:mem:bike_integ;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Evitar que OTP interfiera con el login en las pruebas de integracion
app.otp.desactivado=true
app.limpiar-datos=false

# Datos de ejemplo cargados por DataInitializer (necesarios para el superadmin)
SUPERADMIN_USERNAME=superadmin@test.com
SUPERADMIN_EMAIL=superadmin@test.com
SUPERADMIN_PASSWORD=SuperAdmin123!
