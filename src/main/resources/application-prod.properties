# ==========================================================
# PERFIL DE PRODUCCION - Bike Assembly (Azure PostgreSQL Flexible)
# Conexion con SSL (sslmode=require) - sin certificado local
# ==========================================================
# URL de conexion (todo via variables de entorno para mayor seguridad y flexibilidad)
spring.datasource.url=${DB_URL:jdbc:postgresql://angel-projects.postgres.database.azure.com:5432/bike_assembly?sslmode=require}
spring.datasource.username=${DB_USER:angel27}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Timeouts de Hikari para evitar SocketTimeoutException en la red de Azure
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
