<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Pedidos Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
    <div class="d-flex vh-100">
        <th:block th:if="${empleado != null}">
            <th:block th:if="${empleado.rol.name() == 'ADMIN'}">
                <div th:replace="~{admin/barra :: sidebar}"></div>
            </th:block>
            
            <th:block th:if="${empleado.rol.name() == 'CAJA'}">
                <div th:replace="~{caja/barra :: sidebar}"></div>
            </th:block>
        </th:block>

        <div class="flex-grow-1 p-4 overflow-auto">
            <div class="mb-4">
                <h2 class="fw-bold" style="color: var(--brand-blue);">Pedidos Pendientes</h2>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 ps-4">N° Pedido</th>
                                <th class="py-3">Cliente</th>
                                <th class="py-3">Fecha</th>
                                <th class="py-3 text-end">Total</th>
                                <th class="py-3 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${pedidos == null or pedidos.empty}">
                                <td colspan="5" class="text-center py-4 text-muted">No hay pedidos pendientes en este momento</td>
                            </tr>
                            <tr th:each="pedido : ${pedidos}">
                                <td class="ps-4 fw-bold" th:text="${'#PED-' + pedido.idVenta}"></td>
                                <td th:text="${pedido.cliente != null ? pedido.cliente.nombre : 'Cliente Genérico'}"></td>
                                <td th:text="${#temporals.format(pedido.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="text-end fw-bold text-success" th:text="${'$ ' + pedido.total}"></td>
                                <td class="text-center">
                                    <form th:action="@{/caja/pedidos/completar/{id}(id=${pedido.idVenta})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-success">
                                            <i class="bi bi-check2-circle"></i> Aprobar Despacho
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
