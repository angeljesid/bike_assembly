<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Punto de Venta (POS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <div th:if="${empleado.rol.name() == 'ADMIN'}" class="col-md-2 sidebar-custom d-flex flex-column px-0" th:insert="~{admin/barra :: sidebar}"></div>
            <div th:if="${empleado.rol.name() == 'CAJA'}" class="col-md-2 sidebar-custom d-flex flex-column px-0 bg-dark text-white p-3 shadow-sm" style="min-height: 100vh;">
                <h4 class="text-center mt-3"><i class="bi bi-bicycle text-primary me-2"></i>Bike POS</h4>
                <hr>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="/caja/pos" class="nav-link active"><i class="bi bi-cart-check me-2"></i>Nueva Venta</a>
                    </li>
                </ul>
                <hr>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button>
                </form>
            </div>
            
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <h2><i class="bi bi-shop me-2"></i>Caja Rápida</h2>
                    <span class="badge bg-primary fs-6" th:text="${empleado.nombre}">Cajero</span>
                </div>
                
                <div class="row">
                    <div class="col-md-8">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body">
                                <h5 class="card-title">Catálogo de Servicios Rápidos / Repuestos</h5>
                                <p class="text-muted">Aquí implementaremos la cuadrícula de productos en los próximos pasos.</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm border-primary">
                            <div class="card-body bg-light">
                                <h5 class="card-title text-center">Ticket de Venta</h5>
                                <hr>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Total:</span>
                                    <span class="fw-bold fs-5">$0.00</span>
                                </div>
                                <button class="btn btn-success w-100 mt-3 btn-lg"><i class="bi bi-cash-coin me-2"></i>Cobrar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
