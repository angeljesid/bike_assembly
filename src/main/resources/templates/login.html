<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Iniciar Sesión</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- AGREGAMOS ESTE CONTENEDOR PARA CENTRAR LA TARJETA -->
    <div class="login-wrapper">

        <div class="login-card text-center">
            
            <!-- Logo y Encabezado -->
            <div class="brand-logo">
                <i class="bi bi-bicycle"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Bike Assembly</h3>
            <p class="text-muted small mb-4">Ingresa tus credenciales para continuar</p>

            <!-- ALERTAS DE SPRING SECURITY -->
            <div th:if="${param.error}" class="alert alert-danger border-0 rounded-3 py-2 px-3 mb-3 d-flex align-items-center justify-content-center gap-2 small fw-semibold" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Usuario o contraseña incorrectos.</span>
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success border-0 rounded-3 py-2 px-3 mb-3 d-flex align-items-center justify-content-center gap-2 small fw-semibold" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span>Has cerrado sesión correctamente.</span>
            </div>

            <!-- FORMULARIO DE LOGIN -->
            <form th:action="@{/login}" method="post" class="text-start">
                
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold text-dark small">Usuario</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Tu usuario" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold text-dark small">Contraseña</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="btn btn-link text-muted pe-3 text-decoration-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent w-100 fw-bold fs-6 mb-3 d-flex align-items-center justify-content-center gap-2">
                    <span>Iniciar Sesión</span>
                    <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>

            <!-- Volver al Inicio -->
            <div class="mt-3 pt-3 border-top text-center">
                <a th:href="@{/}" class="text-decoration-none small text-muted fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Volver a la página principal
                </a>
            </div>

        </div>

    </div> <!-- FIN DE LOGIN-WRAPPER -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
