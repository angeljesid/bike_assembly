<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Ensamblaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8fafc; color: #334155; }
        .sidebar { min-height: 100vh; background-color: #1e293b; color: #cbd5e1; padding-top: 24px; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin: 4px 12px; }
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #334155; }
        .sidebar a.active { border-left: 4px solid #10b981; }
        .task-card { border-left: 4px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral -->
            <div class="col-md-2 sidebar px-0 d-flex flex-column">
                <div class="px-4 mb-4">
                    <h5 class="text-white fw-bold"><i class="bi bi-wrench-adjustable me-2"></i>Taller Mecánico</h5>
                </div>
                <div class="flex-grow-1">
                    <a th:href="@{/operario/ensambles}" class="active"><i class="bi bi-gear-wide-connected me-2"></i> Mis Ensambles</a>
                    <a th:href="@{/operario/historial}"><i class="bi bi-clock-history me-2"></i> Historial</a>
                </div>
                <div class="px-3 mb-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-left"></i> Salir</button>
                    </form>
                </div>
            </div>
            
            <!-- Contenido Principal -->
            <div class="col-md-10 p-5">
                <h3 class="fw-bold mb-1" th:text="'Hola, ' + ${operario != null ? operario.nombre : 'Mecánico'}">Hola</h3>
                <p class="text-muted mb-4">Revisa las órdenes de ensamblaje y reparaciones pendientes de hoy.</p>
                
                <div class="card shadow-sm task-card mb-3">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-1">Orden #1024 - Bicicleta MTB Custom</h6>
                            <p class="mb-0 text-muted small">Tareas: Instalación de grupo de transmisión y radiado de ruedas.</p>
                        </div>
                        <button class="btn btn-warning btn-sm fw-bold">Iniciar Ensamble</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
