<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Formulario de Producto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg top-bar-custom px-4 mb-4">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center gap-2 text-dark fw-bold text-decoration-none" href="/admin">
                <i class="bi bi-bicycle"></i> <span>Bike Assembly Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" style="color: var(--brand-blue);" href="/admin/producto"><i class="bi bi-box-seam me-1"></i> Inventario</a>
                    </li>
                    <li class="nav-item ms-3">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom border-0 shadow-sm overflow-hidden">
                    <div class="card-header header-form py-3">
                        <h4 class="mb-0" th:text="${producto.idProducto == null ? 'Añadir Nuevo Producto' : 'Editar Producto'}">Formulario</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/admin/producto/guardar}" th:object="${producto}" method="POST" enctype="multipart/form-data" class="row g-3">
                            
                            <input type="hidden" th:field="*{idProducto}"/>
                            <input type="hidden" th:field="*{imagen}"/>

                            <div class="col-12" th:if="${producto.imagen != null and !producto.imagen.isEmpty()}">
                                <label class="form-label text-muted d-block mb-2">Imagen actual cargada:</label>
                                <img th:src="@{'/recursos/' + ${producto.imagen}}" alt="Imagen actual" class="rounded border shadow-sm" style="max-height: 80px; object-fit: contain;">
                            </div>

                            <div class="col-12">
                                <label for="file" class="form-label fw-bold">Actualizar / Subir Foto del Repuesto</label>
                                <input type="file" name="file" class="form-control" accept="image/*">
                                <div class="form-text">Selecciona una imagen para subir</div>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold">Nombre del Componente</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required maxlength="100" minlength="2" pattern="[A-Za-z0-9 .,/_\-()]+" title="Solo letras, números y caracteres básicos (2-100)" placeholder="Ej: Llanta Maxxis, Marco, Freno mt200">
                            </div>

                            <div class="col-md-6">
                                <label for="codigoBarras" class="form-label fw-bold">Código de Barras <span class="text-muted fw-normal">(Opcional)</span></label>
                                <input type="text" class="form-control" id="codigoBarras" name="codigoBarras" th:value="${producto.codigoBarras}" maxlength="15" minlength="8" pattern="[0-9]{8,15}" title="El código de barras debe tener entre 8 y 15 dígitos numéricos" placeholder="Escanee o digite el código de barras">
                            </div>
                            
                            <div class="col-md-6">
                                <label for="marca" class="form-label fw-bold">Marca</label>
                                <input type="text" class="form-control" th:field="*{marca}" required maxlength="100" minlength="2" pattern="[A-Za-z0-9 .,/_\-()]+" title="Solo letras, números y caracteres básicos (2-100)" placeholder="Ej: Shimano, Maxxis">
                            </div>

                            <div class="col-12">
                                <label for="categoria" class="form-label fw-bold">Categoría del Componente</label>
                                <select class="form-select" th:field="*{categoria}" required>
                                    <option value="" disabled selected>Seleccione la categoría...</option>
                                    <option value="llantas">Llantas y Neumáticos</option>
                                    <option value="marcos">Marcos y Cuadros</option>
                                    <option value="transmision">Grupo de Arrastre y Transmisión</option>
                                    <option value="bicicletas">Bicicletas Completas y Ensamble</option>
                                    <option value="frenos">Frenos y Sistemas de Frenado</option>
                                    <option value="suspension">Suspensión y Amortiguadores</option>
                                    <option value="sillines">Asientos y Tijas</option>
                                    <option value="otros">Accesorios y Componentes Adicionales</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="condicion" class="form-label fw-bold">Condición</label>
                                <select class="form-select" th:field="*{condicion}" required>
                                    <option value="" disabled selected>Seleccione estado...</option>
                                    <option value="Nuevo">Nuevo</option>
                                    <option value="Usado">Usado</option>
                                    <option value="Reacondicionado">Reacondicionado</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="proveedor" class="form-label fw-bold">Proveedor</label>
                                <select class="form-select" th:field="*{proveedor}" required>
                                    <option value="" disabled selected>Seleccione un proveedor...</option>
                                      <option th:each="prov : ${proveedores}" 
                                            th:value="${prov.idProveedor}" 
                                            th:text="${prov.nombre} + ' (' + ${prov.tipoEstablecimiento} + ')'">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="tipo" class="form-label fw-bold">Compatibilidad</label>
                                <select class="form-select" th:field="*{tipo}" required>
                                    <option value="">Seleccione...</option>
                                    <option value="R">Ruta (R)</option>
                                    <option value="T">Todo Terreno (T)</option>
                                    <option value="U">Universal (U)</option>
                                </select>
                            </div>
                            
                            <div class="col-md-4">
                                <label for="stock" class="form-label fw-bold">Cantidad en Stock</label>
                                <input type="number" class="form-control" th:field="*{stock}" required min="0">
                            </div>

                            <div class="col-md-4">
                                <label for="precioInicial" class="form-label fw-bold">Precio Inicial ($)</label>
                                <input type="number" step="0.01" class="form-control calc-precio" id="precioInicial" th:field="*{precioInicial}" required min="0">
                            </div>

                            <div class="col-md-4">
                                <label for="iva" class="form-label fw-bold">IVA (%)</label>
                                <input type="number" step="0.01" class="form-control calc-precio" id="iva" th:field="*{iva}" required min="0" placeholder="Ej: 19">
                            </div>

                            <div class="col-md-4">
                                <label for="precioTotal" class="form-label fw-bold text-primary">Precio Total ($)</label>
                                <input type="number" step="0.01" class="form-control bg-white" id="precioTotal" th:field="*{precioTotal}" required readonly>
                            </div>

                            <div class="col-md-12 mt-3">
                                <div class="card bg-light border-0">
                                    <div class="card-body">
                                        <div class="form-check form-switch mb-3">
                                            <input class="form-check-input" type="checkbox" id="chkPublicar"
                                                th:checked="${producto.unidadesPublicadas != null and producto.unidadesPublicadas > 0}">
                                            <label class="form-check-label fw-bold text-primary" for="chkPublicar">
                                                <i class="bi bi-shop me-1"></i>Publicar en el Mercado
                                            </label>
                                        </div>
                                        <label for="unidadesPublicadas" class="form-label fw-semibold">Unidades a Publicar</label>
                                        <input type="number" class="form-control border-primary" id="unidadesPublicadas" th:field="*{unidadesPublicadas}" required min="0" th:max="${producto.stock}">
                                        <div class="form-text">
                                            Debe ser de 1 hasta el stock disponible (<span th:text="${producto.stock != null ? producto.stock : 0}">0</span>).
                                        </div>
                                        <span class="form-text text-muted">Desmarca para no publicar nada.</span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/admin/producto}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/seguridad.js}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const precioInicialInput = document.getElementById('precioInicial');
            const ivaInput = document.getElementById('iva');
            const precioTotalInput = document.getElementById('precioTotal');

            function calcularTotal() {
                const precioInicial = parseFloat(precioInicialInput.value) || 0;
                const iva = parseFloat(ivaInput.value) || 0;
                const total = precioInicial + (precioInicial * (iva / 100));
                
                // Redondear a dos decimales y actualizar el campo total
                precioTotalInput.value = total.toFixed(2);
            }

            precioInicialInput.addEventListener('input', calcularTotal);
            ivaInput.addEventListener('input', calcularTotal);

            const chkPublicar = document.getElementById('chkPublicar');
            const unidadesInput = document.getElementById('unidadesPublicadas');

            function aplicarEstadoPublicacion() {
                if (chkPublicar.checked) {
                    unidadesInput.disabled = false;
                    if (unidadesInput.value === '' || unidadesInput.value === '0') {
                        unidadesInput.value = unidadesInput.max || unidadesInput.value || 0;
                    }
                } else {
                    unidadesInput.disabled = true;
                    unidadesInput.value = '0';
                }
            }

            chkPublicar.addEventListener('change', aplicarEstadoPublicacion);
            aplicarEstadoPublicacion();
        });
    </script>
</body>
</html>
