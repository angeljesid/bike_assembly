<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Formulario de Producto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg top-bar-custom px-4 mb-4">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center gap-2 text-dark fw-bold text-decoration-none" href="/admin">
                <div class="brand-logo">
                    <i class="bi bi-bicycle"></i>
                </div>
                <span>Bike Assembly Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" style="color: var(--brand-blue);" href="/admin/producto"><i class="bi bi-box-seam me-1"></i> Inventario</a>
                    </li>
                    <li class="nav-item ms-3">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom border-0 shadow-sm overflow-hidden">
                    <div class="card-header header-form py-3">
                        <h4 class="mb-0" th:text="${producto.idProducto == null ? 'Añadir Nuevo Producto' : 'Editar Producto'}">Formulario</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/admin/producto/guardar}" th:object="${producto}" method="POST" enctype="multipart/form-data">
                            
                            <input type="hidden" th:field="*{idProducto}"/>
                            
                            <input type="hidden" th:field="*{imagen}"/>

                            <div class="mb-3" th:if="${producto.imagen != null and !producto.imagen.isEmpty()}">
                                <label class="form-label text-muted d-block">Imagen actual cargada:</label>
                                <img th:src="@{'/recursos/' + ${producto.imagen}}" alt="Imagen actual" class="rounded border shadow-sm" style="max-height: 80px; object-fit: contain;">
                            </div>

                            <div class="mb-3">
                                <label for="file" class="form-label fw-bold">Actualizar / Subir Foto del Repuesto</label>
                                <input type="file" name="file" class="form-control" accept="image/*">
                                <div class="form-text">Selecciona una imagen para subir</div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label fw-bold">Nombre del Componente</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej: Llanta Maxxis, Marco, Freno mt200">
                                </div>
                                <div class="col-md-6">
                                    <label for="marca" class="form-label fw-bold">Marca</label>
                                    <input type="text" class="form-control" th:field="*{marca}" required placeholder="Ej: Shimano, Maxxis">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label for="tipo" class="form-label fw-bold">Compatibilidad</label>
                                    <select class="form-select" th:field="*{tipo}" required>
                                        <option value="">Seleccione...</option>
                                        <option value="R">Ruta (R)</option>
                                        <option value="T">Todo Terreno (T)</option>
                                        <option value="U">Universal (U)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="stock" class="form-label fw-bold">Cantidad en Stock</label>
                                    <input type="number" class="form-control" th:field="*{stock}" required min="0">
                                </div>
                                <div class="col-md-4">
                                    <label for="precio" class="form-label fw-bold">Precio Unitario ($)</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" required min="0">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/producto}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Guardar
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
