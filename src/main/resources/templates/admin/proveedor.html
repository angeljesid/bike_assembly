<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Proveedores</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div class="d-flex">
        
        <div th:replace="~{admin/barra :: sidebar}"></div>

        <div class="flex-grow-1 p-4 overflow-auto">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="fw-bold m-0" style="color: var(--brand-blue);">Gestión de Proveedores</h2>
                    <p class="text-muted m-0 mt-1">Administra tus empresas y bodegas de suministro.</p>
                </div>
                <a th:href="@{/admin/proveedor/nuevo}" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm rounded-pill px-4 py-2">
                    <i class="bi bi-plus-circle fs-5"></i> 
                    <span class="fw-semibold">Añadir Proveedor</span>
                </a>
            </div>

            <!-- BARRA DE BÚSQUEDA INTEGRADA -->
            <div class="mb-4">
                <div class="input-group input-group-lg shadow-sm border rounded-pill overflow-hidden bg-white" style="max-width: 700px;">
                    <span class="input-group-text bg-transparent border-0 text-muted ps-4">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="buscadorProveedores" class="form-control border-0 shadow-none bg-transparent" placeholder="Buscar por nombre, tipo, teléfono, correo o dirección..." autocomplete="off">
                </div>
            </div>

            <div class="card card-custom border-0 shadow-sm overflow-hidden">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4 py-3 text-secondary">Nombre</th>
                                <th class="py-3 text-secondary">Tipo</th>
                                <th class="py-3 text-secondary">Contacto</th>
                                <th class="py-3 text-secondary">Dirección</th>
                                <th class="px-4 py-3 text-secondary text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="border-top-0" id="tbody-proveedores">
                            <!-- Los datos se cargan y filtran dinámicamente con JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/buscador.js}"></script>
</body>
</html>
