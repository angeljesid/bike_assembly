<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Configuración del Negocio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div class="d-flex">
        
        <div th:replace="~{admin/barra :: sidebar('configuracion')}"></div>

        <div class="flex-grow-1 p-4 overflow-auto">
            
            <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <strong>¡Actualizado!</strong> Los datos de tu tienda se han guardado correctamente.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="fw-bold m-0 text-dark">Configuración del Negocio</h2>
                    <p class="text-muted m-0 mt-1">Administra la información pública de tu tienda y datos de contacto.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card card-custom border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-header bg-white border-bottom px-4 py-3">
                            <h5 class="fw-bold m-0 text-dark fs-6"><i class="bi bi-shop me-2 text-primary"></i>Datos del Establecimiento</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/admin/configuracion/guardar}" method="post">
                                
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-secondary small">Nombre de la Tienda</label>
                                        <input type="text" class="form-control bg-light text-muted" th:value="${organizacion.nombre}" disabled>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-secondary small">Teléfono / WhatsApp</label>
                                        <input type="text" class="form-control bg-light" name="telefono" th:value="${organizacion.telefono}" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-secondary small">Dirección Física</label>
                                    <input type="text" class="form-control bg-light" name="direccion" th:value="${organizacion.direccion}" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-secondary small">Tipo de Organización</label>
                                    <select class="form-select bg-light text-muted" disabled>
                                        <option value="Taller Pequeño" th:selected="${organizacion.tipo == 'Taller Pequeño'}">Taller Pequeño</option>
                                        <option value="Taller Mediano" th:selected="${organizacion.tipo == 'Taller Mediano'}">Taller Mediano</option>
                                        <option value="Taller Grande" th:selected="${organizacion.tipo == 'Taller Grande'}">Taller Grande</option>
                                        <option value="Bodega" th:selected="${organizacion.tipo == 'Bodega'}">Bodega</option>
                                        <option value="Bodega Grande" th:selected="${organizacion.tipo == 'Bodega Grande'}">Bodega Grande</option>
                                    </select>
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm">Guardar Cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card card-custom border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom px-4 py-3">
                            <h5 class="fw-bold m-0 text-dark fs-6"><i class="bi bi-person-badge me-2 text-primary"></i>Administrador Actual</h5>
                        </div>
                        <div class="card-body p-4 text-center">
                            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                                <i class="bi bi-person-fill fs-1"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-1" th:text="${admin.nombre}">Nombre Admin</h5>
                            <p class="text-muted small mb-3" th:text="${admin.email}">admin@correo.com</p>
                            <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill fw-medium border border-success-subtle">
                                <i class="bi bi-shield-check me-1"></i> Cuenta Verificada
                            </span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
