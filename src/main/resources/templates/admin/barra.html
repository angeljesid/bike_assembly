<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barra Lateral</title>
</head>
<body>

    <div class="d-flex flex-column flex-shrink-0 p-3 text-white sidebar-custom" th:fragment="sidebar">
        
        <a href="/admin" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none px-2 py-3">
            <div class="brand-logo bg-white text-dark rounded-circle p-2 d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px;">
                <i class="bi bi-bicycle fs-5"></i>
            </div>
            <span class="fs-5 fw-bold">Bike Assembly</span>
        </a>
        
        <hr class="text-white-50">
        
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/admin" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-house-door fs-5"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="/admin/caja" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-cart-check fs-5"></i>
                    <span>Caja (POS)</span>
                </a>
            </li>
            <li>
                <a href="/admin/producto" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-box-seam fs-5"></i>
                    <span>Productos</span>
                </a>
            </li>
            <li>
                <a href="/admin/proveedor" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-buildings fs-5"></i>
                    <span>Proveedores</span>
                </a>
            </li>

            <li>
                <a href="/admin/ventas" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-clock-history fs-5"></i>
                    <span>Historial de Ventas</span>
                </a>
            </li>

            <li>
                <a href="/admin/pedidos" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-bell-fill fs-5"></i>
                    <span>Pedidos Pendientes</span>
                </a>
            </li>

            <li>
                <a href="/admin/configuracion" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-gear-fill fs-5"></i>
                    <span>Configuración</span>
                </a>
            </li>

            <li>
                <a href="/admin/empleados" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-people-fill fs-5"></i>
                    <span>Empleados</span>
                </a>
            </li>
            
        </ul>
        
        <hr class="text-white-50">
        
        <div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="nav-link text-white d-flex align-items-center gap-2 border-0 bg-transparent w-100 py-2">
                    <i class="bi bi-box-arrow-right fs-5 text-danger"></i>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
