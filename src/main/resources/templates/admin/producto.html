<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Gestión de Productos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div class="d-flex">
        
        <div th:replace="~{admin/barra :: sidebar('producto')}"></div>

        <div class="flex-grow-1 p-4 overflow-auto">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold" style="color: var(--brand-blue);">Gestión de Productos</h2>
                    <p class="text-muted m-0">Administra el inventario y clasifica los repuestos por categoría.</p>
                </div>
                <a th:href="@{/admin/producto/nuevo}" class="btn btn-accent shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Añadir Producto
                </a>
            </div>

            <div class="mb-4">
                <div class="input-group input-group-lg shadow-sm border rounded-pill overflow-hidden bg-white" style="max-width: 700px;">
                    <span class="input-group-text bg-transparent border-0 text-muted ps-4">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="buscadorProductos" class="form-control border-0 shadow-none bg-transparent" placeholder="Buscar por nombre, marca o tipo de componente..." autocomplete="off">
                </div>
            </div>

            <div class="row g-4">
                <div th:replace="~{:: tarjeta('llantas', 'Llantas y Neumáticos', 'bi-circle-fill text-warning', 'Sección de Rodamiento')}"></div>
                <div th:replace="~{:: tarjeta('marcos', 'Marcos/Cuadros', 'bi-shield-shaded text-primary', 'Estructura Principal')}"></div>
                <div th:replace="~{:: tarjeta('transmision', 'Grupo de Arrastre y Transmisión', 'bi-gear-fill text-success', 'Sistema de Transmisión')}"></div>
                <div th:replace="~{:: tarjeta('bicicletas', 'Bicicletas Completas y Ensamble', 'bi-bicycle text-danger', 'Unidades Armadas')}"></div>
                <div th:replace="~{:: tarjeta('frenos', 'Frenos y Discos', 'bi-record-circle-fill text-dark', 'Sistema de Frenado')}"></div>
                <div th:replace="~{:: tarjeta('suspension', 'Suspensión y Horquillas', 'bi-arrows-collapse text-secondary', 'Amortiguación')}"></div>
                <div th:replace="~{:: tarjeta('sillines', 'Sillines y Tijas', 'bi-triangle-fill text-secondary', 'Comodidad y Ajuste')}"></div>
                <div th:replace="~{:: tarjeta('otros', 'Otros Accesorios y Componentes', 'bi-grid-fill text-info', 'Misceláneos')}"></div>
            </div>

        </div>
    </div>

    <div style="display: none;">
        <div th:fragment="tarjeta(catKey, titulo, icono, badge)" class="col-12">
            <div class="card category-card overflow-hidden">
                <div class="card-header bg-white py-3 px-4 d-flex justify-content-between align-items-center border-bottom">
                    <h5 class="fw-bold m-0" style="color: var(--brand-blue);">
                        <i th:class="'bi me-2 fs-6 ' + ${icono}"></i> <span th:text="${titulo}"></span>
                    </h5>
                    <span class="badge bg-light text-dark border" th:text="${badge}"></span>
                </div>
                <div class="card-body p-0 card-scroll-body">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th class="py-2 ps-4" style="width: 80px;">Foto</th>
                                <th class="py-2">Referencia</th>
                                <th class="py-2">Componente / Marca</th>
                                <th class="py-2">Condición</th>
                                <th class="py-2">Proveedor</th>
                                <th class="py-2">Código de Barras</th>
                                <th class="py-2 text-end">Inicial</th>
                                <th class="py-2 text-center">IVA</th>
                                <th class="py-2 text-end">Total</th>
                                <th class="py-2 text-center">Stock</th>
                                <th class="py-2 text-center" style="width: 110px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody th:id="'tbody-' + ${catKey}">
                            <tr th:each="producto : ${productos}" th:if="${producto.categoria != null and #strings.toLowerCase(producto.categoria) == catKey}">
                                <td class="ps-4">
                                    <img th:if="${producto.imagen != null and !producto.imagen.isEmpty()}" th:src="@{'/recursos/' + ${producto.imagen}}" class="catalogo-img rounded" alt="Foto">
                                    <img th:if="${producto.imagen == null or producto.imagen.isEmpty()}" src="https://via.placeholder.com/80x80.png?text=Sin+Foto" class="catalogo-img rounded" alt="Default">
                                </td>
                                <td class="fw-bold text-muted" th:text="${'ID-' + producto.idProducto}"></td>
                                <td>
                                    <span class="fw-bold text-dark" th:text="${producto.nombre}"></span><br>
                                    <small class="text-muted">
                                        <i class="bi bi-tag-fill me-1"></i><span th:text="${producto.marca}"></span> 
                                        <span th:if="${catKey == 'llantas'}">| Comp: <span th:text="${producto.tipo}"></span></span>
                                    </small>
                                </td>
                                <td th:text="${producto.condicion}"></td>
                                <td th:text="${producto.proveedor != null ? producto.proveedor.nombre : 'N/A'}"></td>
                                <td>
                                    <span class="text-muted" th:text="${producto.codigoBarras != null && !producto.codigoBarras.isEmpty() ? producto.codigoBarras : 'N/A'}"></span>
                                </td>
                                <td class="text-end text-muted" th:text="${'$ ' + (producto.precioInicial != null ? producto.precioInicial : '0.00')}"></td>
                                <td class="text-center text-muted" th:text="${(producto.iva != null ? producto.iva : '0') + '%'}"></td>
                                <td class="text-end fw-bold" style="color: var(--brand-blue);" th:text="${'$ ' + (producto.precioTotal != null ? producto.precioTotal : (producto.precio != null ? producto.precio : '0.00'))}"></td>
                                <td class="text-center">
                                    <span th:class="${producto.stock != null && producto.stock < 5 ? 'badge bg-danger' : 'badge bg-info text-dark'}" th:text="${producto.stock} + ' und'"></span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <a th:href="@{/admin/producto/editar/{id}(id=${producto.idProducto})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                        <a th:href="@{/admin/producto/eliminar/{id}(id=${producto.idProducto})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este producto?');" title="Eliminar"><i class="bi bi-trash"></i></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/seguridad.js}"></script>
    <script th:src="@{/js/buscador.js}"></script>
</body>
</html>
