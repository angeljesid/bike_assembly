<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="/cliente/catalogo"><i class="bi bi-bicycle text-primary me-2"></i>Bike Assembly</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold text-primary" href="/cliente/catalogo">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/cliente/pedidos">Mis Pedidos</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted fw-semibold" th:text="'Hola, ' + ${cliente != null ? cliente.nombre : 'Cliente'}">Hola, Cliente</span>
                    <a th:href="@{/cliente/carrito}" class="btn btn-primary position-relative me-2 text-decoration-none">
                        <i class="bi bi-cart3"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contadorCarrito">
                            0
                        </span>
                    </a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Cerrar Sesión"><i class="bi bi-box-arrow-right"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h3 class="fw-bold m-0" style="color: var(--brand-blue);">Configura tu Bicicleta</h3>
                <p class="text-muted small m-0">Encuentra los mejores repuestos y piezas.</p>
            </div>

            <div class="col-md-6 mt-3 mt-md-0">
                <div class="input-group input-group-lg shadow-sm border rounded-pill overflow-hidden bg-white">
                    <span class="input-group-text bg-transparent border-0 text-muted ps-4">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="buscadorCliente" class="form-control border-0 shadow-none bg-transparent" placeholder="Buscar llantas, marcos, marcas..." autocomplete="off">
                </div>
            </div>
        </div>

        <div id="mensajeCarga" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="text-muted mt-2">Cargando catálogo...</p>
        </div>

        <div id="mensajeSinResultados" class="text-center py-5" style="display: none;">
            <i class="bi bi-search fs-1 text-muted opacity-50 d-block mb-3"></i>
            <h5 class="text-muted">No encontramos productos que coincidan con tu búsqueda.</h5>
        </div>

        <div class="row g-4" id="contenedorProductos" style="display: none;">
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        const username = /*[[${cliente != null ? (cliente.username != null ? cliente.username : cliente.email) : 'invitado'}]]*/ 'invitado';
        window.CART_KEY = 'carrito_' + username;
    </script>
    <script th:src="@{/js/catalogo-cliente.js}"></script>
</body>
</html>
