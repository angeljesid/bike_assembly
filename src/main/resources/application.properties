spring.application.name=bike_assembly

# Base de datos (valores por defecto para dev; sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bike_assembly}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Activación de perfiles (por defecto 'dev'; sobrescribir con APP_PROFILE=prod)
spring.profiles.active=${APP_PROFILE:dev}

# ============ Correo (SMTP Gmail) ============
# Configurar con variables de entorno: MAIL_USERNAME (tu correo Gmail),
# MAIL_PASSWORD (clave de aplicación de Gmail, requiere verificación en 2 pasos)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Límites de subida de archivos (imágenes de productos/proveedores)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

app.limpiar-datos=${LIMPIAR_DATOS:false}
app.otp.desactivado=${OTP_DESACTIVADO:true}

#---
spring.config.activate.on-profile=dev
# Perfil de desarrollo (por defecto): SQL visible en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#---
spring.config.activate.on-profile=prod
# Perfil de producción: SQL silenciado
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false