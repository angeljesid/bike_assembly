services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bike_assembly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/bike_assembly
      DB_USER: postgres
      DB_PASSWORD: root
      APP_PROFILE: prod
      SUPERADMIN_USERNAME: comezaquira2005@gmail.com
      SUPERADMIN_EMAIL: comezaquira2005@gmail.com
      SUPERADMIN_PASSWORD: super1234
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: