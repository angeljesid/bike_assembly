spring.application.name=bike_assembly

# Base de datos (valores por defecto para dev; sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bike_assembly}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Activación de perfiles (por defecto 'dev')
spring.profiles.active=${APP_PROFILE:dev}
