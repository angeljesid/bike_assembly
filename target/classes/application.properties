spring.application.name=bike_assembly

# Base de datos (valores por defecto para dev; sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bike_assembly}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Activación de perfiles (por defecto 'dev')
spring.profiles.active=${APP_PROFILE:dev}

# ============ Correo (SMTP Gmail) ============
# Configurar con variables de entorno: MAIL_USERNAME (tu correo Gmail),
# MAIL_PASSWORD (clave de aplicación de Gmail, requiere verificación en 2 pasos)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============ Aplicación ============
# URL base usada para construir enlaces en correos (recuperación, 2FA)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Activación de la limpieza de datos al arrancar (deja solo el superadmin re-creado)
app.limpiar-datos=${LIMPIAR_DATOS:false}

# ============ Super administrador ============
# Datos de la cuenta SUPER_ADMIN que DataInitializer garantiza que exista.
# Se leen de variables de entorno; la contraseña NO debe quedar en este archivo.
# SUPERADMIN_USERNAME (login, por defecto igual al email), SUPERADMIN_EMAIL,
# y SUPERADMIN_PASSWORD (obligatoria si no existe superadmin).

