<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Bike Assembly - Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card text-center">

            <div class="brand-logo">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Establece una nueva contraseña</h3>
            <p class="text-muted small mb-4">Debe ser segura: al menos 8 caracteres, con mayúscula, minúscula, número y símbolo.</p>

            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 py-2 px-3 mb-3 small fw-semibold" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/recuperar-password/reset}" method="post" class="text-start">

                <input type="hidden" name="token" th:value="${token}">

                <div class="mb-3">
                    <label for="password" class="form-label fw-bold text-dark small">Nueva contraseña</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required minlength="8">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-bold text-dark small">Confirmar contraseña</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="btn btn-accent w-100 fw-bold fs-6 mb-3">Guardar contraseña</button>
            </form>

            <div class="mt-3 pt-3 border-top text-center">
                <a th:href="@{/login}" class="text-decoration-none small text-muted fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Volver a iniciar sesión
                </a>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/seguridad.js}"></script>
</body>
</html>
