<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Proveedores</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div class="d-flex">
        
        <div th:replace="~{admin/barra :: sidebar}"></div>

        <div class="flex-grow-1 p-4 overflow-auto">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="fw-bold m-0" style="color: var(--brand-blue);">Gestión de Proveedores</h2>
                    <p class="text-muted m-0 mt-1">Administra tus empresas, historial de suministros e ingresos de mercancía.</p>
                </div>
                <a th:href="@{/admin/proveedor/nuevo}" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm rounded-pill px-4 py-2 border-0 fw-bold">
                    <i class="bi bi-plus-circle-fill fs-5"></i> 
                    <span>Añadir Proveedor</span>
                </a>
            </div>

            <div class="mb-4">
                <div class="input-group input-group-lg shadow-sm border rounded-pill overflow-hidden bg-white" style="max-width: 700px;">
                    <span class="input-group-text bg-transparent border-0 text-muted ps-4">
                        <i class="bi bi-search text-primary"></i>
                    </span>
                    <input type="text" id="buscadorProveedores" class="form-control border-0 shadow-none bg-transparent" placeholder="Buscar por nombre, tipo, teléfono, correo o dirección..." autocomplete="off">
                </div>
            </div>

            <div class="card card-custom border-0 shadow-sm overflow-hidden rounded-4">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4 py-3 text-secondary fw-bold">Nombre</th>
                                <th class="py-3 text-secondary fw-bold">Tipo</th>
                                <th class="py-3 text-secondary fw-bold">Contacto</th>
                                <th class="py-3 text-secondary fw-bold">Dirección</th>
                                <th class="px-4 py-3 text-secondary text-end fw-bold">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="border-top-0" id="tbody-proveedores">
                            <tr th:each="prov : ${proveedores}">
                                <td class="px-4 py-3 fw-bold text-dark" th:text="${prov.nombre}">GW</td>
                                <td class="py-3">
                                    <span class="badge bg-light text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-semibold" th:text="${prov.tipoEstablecimiento}">Empresa</span>
                                </td>
                                <td class="py-3">
                                    <div class="fw-medium text-dark"><i class="bi bi-telephone text-muted me-1"></i> <span th:text="${prov.numero}">3000000000</span></div>
                                    <small class="text-muted"><i class="bi bi-envelope me-1"></i> <span th:text="${prov.correo}">correo@ejemplo.com</span></small>
                                </td>
                                <td class="py-3 text-muted"><i class="bi bi-geo-alt me-1"></i> <span th:text="${prov.direccion}">Calle 123</span></td>
                                <td class="px-4 py-3 text-end">
                                    <div class="d-inline-flex align-items-center gap-2">
                                        <a th:href="@{/admin/proveedor/editar/{id}(id=${prov.idProveedor})}" 
                                           class="btn btn-sm btn-light text-primary border shadow-sm rounded-pill px-3 py-1 fw-semibold d-inline-flex align-items-center gap-1" 
                                           data-bs-toggle="tooltip" 
                                           data-bs-placement="top" 
                                           title="Ver historial de compras, productos y editar datos del proveedor">
                                            <i class="bi bi-box-seam-fill"></i>
                                            <span>Suministros / Editar</span>
                                        </a>
                                        <a th:href="@{/admin/proveedor/eliminar/{id}(id=${prov.idProveedor})}" 
                                           class="btn btn-sm btn-light text-danger border shadow-sm rounded-circle p-0 d-inline-flex align-items-center justify-content-center" 
                                           style="width: 32px; height: 32px;" 
                                           data-bs-toggle="tooltip" 
                                           title="Eliminar proveedor" 
                                           onclick="return confirm('¿Estás seguro de eliminar este proveedor?');">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/buscador.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        });
    </script>
</body>
</html>
