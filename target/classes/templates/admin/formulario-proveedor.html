<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Formulario de Proveedor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg top-bar-custom px-4 mb-4">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center gap-2 text-dark fw-bold text-decoration-none" href="/admin">
                <i class="bi bi-bicycle"></i> <span>Bike Assembly Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" style="color: var(--brand-blue);" href="/admin/proveedor"><i class="bi bi-buildings me-1"></i> Proveedores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom border-0 shadow-sm overflow-hidden">
                    <div class="card-header header-form py-3">
                        <h4 class="mb-0" th:text="${proveedor.idProveedor == null ? 'Añadir Nuevo Proveedor' : 'Editar Proveedor'}">Formulario</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/admin/proveedor/guardar}" th:object="${proveedor}" method="POST" class="row g-3">
                            
                            <input type="hidden" th:field="*{idProveedor}"/>
                            
                            <div class="col-md-8">
                                <label for="nombre" class="form-label fw-bold">Nombre de la Empresa o Bodega</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej: Shimano Distribuidor S.A.">
                            </div>

                            <div class="col-md-4">
                                <label for="tipoEstablecimiento" class="form-label fw-bold">Tipo</label>
                                <select class="form-select" th:field="*{tipoEstablecimiento}" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="Empresa">Empresa</option>
                                    <option value="Bodega">Bodega</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="numero" class="form-label fw-bold">Número de Teléfono</label>
                                <input type="text" class="form-control" th:field="*{numero}" required placeholder="Ej: 3001234567">
                            </div>

                            <div class="col-md-6">
                                <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" class="form-control" th:field="*{correo}" required placeholder="contacto@empresa.com">
                            </div>

                            <div class="col-12">
                                <label for="direccion" class="form-label fw-bold">Dirección Física</label>
                                <input type="text" class="form-control" th:field="*{direccion}" required placeholder="Ej: Calle 123 #45-67, Zona Industrial">
                            </div>

                            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/admin/proveedor}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
