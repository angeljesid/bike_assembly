<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Catálogo de Repuestos</title>
    <!-- CSS de Bootstrap 5 para el diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-bicycle me-2"></i>Bike Assembly
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-gear-fill me-1"></i> Repuestos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-cart3 me-1"></i> Mi Ensamblaje</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container">
        <div class="row mb-4 align-items-center">
            <div class="col-md-8">
                <h2 class="text-primary fw-bold">Catálogo de Componentes</h2>
                <p class="text-muted">Selecciona los repuestos compatibles para armar tu bicicleta a medida.</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Nuevo Repuesto
                </button>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Componente</th>
                                <th>Marca</th>
                                <th>Tipo</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Aquí Thymeleaf itera sobre la lista de productos que envía el controlador -->
                            <tr th:each="producto : ${productos}">
                                <td th:text="${producto.idProducto}">1</td>
                                <td class="fw-bold" th:text="${producto.nombre}">Marco GW Ocelot</td>
                                <td><span class="badge bg-secondary" th:text="${producto.marca}">GW</span></td>
                                <td th:text="${producto.tipo}">Montaña</td>
                                <td th:text="${'$ ' + producto.precio}">$ 450000</td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${producto.stock} + ' und'">5 und</span>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary" title="Añadir al carrito">
                                        <i class="bi bi-cart-plus"></i> Añadir
                                    </button>
                                </td>
                            </tr>
                            <!-- Mensaje si la base de datos está vacía -->
                            <tr th:if="${productos == null or productos.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay repuestos registrados en el inventario aún.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
