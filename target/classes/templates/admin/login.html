<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Iniciar Sesión</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        
                        <!-- Encabezado y Logo -->
                        <div class="text-center mb-4">
                            <i class="bi bi-bicycle text-primary" style="font-size: 3rem;"></i>
                            <h3 class="fw-bold mt-2 text-dark">Bike Assembly</h3>
                            <p class="text-muted small">Ingresa tus credenciales para continuar</p>
                        </div>

                        <!-- Alertas de Spring Security -->
                        <!-- Sale en rojo si el usuario/clave está mal -->
                        <div th:if="${param.error}" class="alert alert-danger text-center py-2">
                            <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos.
                        </div>
                        
                        <!-- Sale en verde si cerró sesión -->
                        <div th:if="${param.logout}" class="alert alert-success text-center py-2">
                            <i class="bi bi-check-circle"></i> Has cerrado sesión correctamente.
                        </div>

                        <!-- Formulario de Login -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">
                                Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-1"></i>
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
