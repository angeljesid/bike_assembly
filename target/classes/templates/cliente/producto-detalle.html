<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Detalle del Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-custom py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="/cliente"><i class="bi bi-bicycle text-primary me-2"></i>Bike Assembly</a>
            <a href="/cliente/carrito" class="btn btn-primary position-relative text-decoration-none">
                <i class="bi bi-cart3"></i> Ver Carrito
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contadorCarrito">0</span>
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="mb-4">
            <a href="/cliente" class="text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Volver al catálogo</a>
        </div>

        <div class="row g-5">
            <div class="col-md-6">
                <div class="product-image-box">
                    <img src="/img/placeholder.png" alt="Producto" id="imgDetalle" onerror="this.src='/img/placeholder.png'">
                </div>
            </div>

            <div class="col-md-6">
                <span class="badge bg-primary mb-2" id="categoriaDetalle">Categoría</span>
                <h2 class="fw-bold mb-3" id="nombreDetalle">Cargando producto...</h2>
                
                <p class="text-muted mb-4" id="descripcionDetalle">
                    Descripción detallada del componente, compatibilidad y materiales de fabricación.
                </p>

                <div class="d-flex align-items-center mb-4">
                    <span class="text-muted me-3">Condición: <strong class="text-dark" id="condicionDetalle">-</strong></span>
                    <span class="text-muted">Stock disponible: <strong class="text-dark" id="stockDetalle">-</strong></span>
                </div>

                <h1 class="fw-bold mb-4" style="color: #0d6efd;" id="precioDetalle">$0</h1>

                <div class="d-flex gap-3 mb-4">
                    <input type="number" class="form-control text-center" value="1" min="1" max="10" style="width: 80px;" id="cantidadProducto">
                    <button class="btn btn-primary btn-lg flex-grow-1" onclick="añadirDesdeDetalle()">
                        <i class="bi bi-cart-plus me-2"></i> Añadir al carrito
                    </button>
                </div>
                
                <div class="alert alert-info border-0 bg-opacity-10 d-flex align-items-center">
                    <i class="bi bi-shield-check fs-4 me-3 text-info"></i>
                    <div>
                        <h6 class="mb-0 fw-bold">Garantía Bike Assembly</h6>
                        <small>Devoluciones gratuitas en repuestos con defectos de fábrica.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/seguridad.js}"></script>
    <script th:inline="javascript">
        const username = /*[[${cliente != null ? (cliente.username != null ? cliente.username : cliente.email) : 'invitado'}]]*/ 'invitado';
        window.CART_KEY = 'carrito_' + username;
    </script>
    <script th:src="@{/js/catalogo-cliente.js}"></script>
</body>
</html>
