<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Verificar Código</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="login-wrapper">

        <div class="login-card text-center">

            <div class="brand-logo">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Verificación en dos pasos</h3>
            <p class="text-muted small mb-4">
                Hola <span th:text="${nombre}">usuario</span>. Te enviamos un código de seguridad de 6 dígitos a tu
                correo para continuar.
            </p>

            <div th:if="${correoEnviado}" class="alert alert-success border-0 rounded-3 py-2 px-3 mb-3 d-flex align-items-center justify-content-center gap-2 small fw-semibold" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span>Código enviado a tu correo. Válido por 24 horas.</span>
            </div>

            <div th:if="${correoEnviado != null and !correoEnviado}" class="alert alert-warning border-0 rounded-3 py-2 px-3 mb-3 d-flex align-items-center justify-content-center gap-2 small fw-semibold" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>No pudimos enviar el correo. Revisa la configuración SMTP o pulsa &quot;Reenviar código&quot;.</span>
            </div>

            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 py-2 px-3 mb-3 d-flex align-items-center justify-content-center gap-2 small fw-semibold" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}">Error.</span>
            </div>

            <form th:action="@{/verificar-otp}" method="post" class="text-start">

                <div class="mb-3">
                    <label for="codigo" class="form-label fw-bold text-dark small">Código de seguridad</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="text" class="form-control text-center fw-bold fs-4" id="codigo" name="codigo"
                               placeholder="••••••" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
                               autocomplete="one-time-code" autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent w-100 fw-bold fs-6 mb-3 d-flex align-items-center justify-content-center gap-2">
                    <span>Verificar</span>
                    <i class="bi bi-check-circle fs-5"></i>
                </button>
            </form>

            <form th:action="@{/verificar-otp/reenviar}" method="post" class="text-start mt-2">
                <button type="submit" class="btn btn-outline-secondary w-100 fw-semibold mb-3 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-arrow-repeat"></i>
                    <span>Reenviar código</span>
                </button>
            </form>

            <div class="mt-3 pt-3 border-top text-center">
                <a th:href="@{/logout}" class="text-decoration-none small text-muted fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </a>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
