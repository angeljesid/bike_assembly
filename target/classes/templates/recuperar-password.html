<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Bike Assembly - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card text-center">

            <div class="brand-logo">
                <i class="bi bi-key"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Recuperar contraseña</h3>
            <p class="text-muted small mb-4">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

            <div th:if="${enviado}" class="alert alert-success border-0 rounded-3 py-2 px-3 mb-3 small fw-semibold" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                Si el correo existe y está registrado, recibirás un enlace de recuperación.
            </div>

            <div th:if="${tokenInvalido}" class="alert alert-danger border-0 rounded-3 py-2 px-3 mb-3 small fw-semibold" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                El enlace es inválido o ha expirado. Solicita uno nuevo.
            </div>

            <form th:action="@{/recuperar-password}" method="post" class="text-start">

                <div class="mb-4">
                    <label for="email" class="form-label fw-bold text-dark small">Correo electrónico</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required maxlength="100" autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent w-100 fw-bold fs-6 mb-3">Enviar enlace</button>
            </form>

            <div class="mt-3 pt-3 border-top text-center">
                <a th:href="@{/login}" class="text-decoration-none small text-muted fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Volver a iniciar sesión
                </a>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/seguridad.js}"></script>
</body>
</html>
