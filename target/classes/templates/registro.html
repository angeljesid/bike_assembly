<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card text-center">
            
            <div class="brand-logo">
                <i class="bi bi-bicycle"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Crea tu cuenta</h3>
            <p class="text-muted small mb-4" th:text="${plan != null ? 'Registrando taller con plan ' + plan : 'Únete a Bike Assembly'}">Únete a Bike Assembly</p>

            <div th:if="${plan != null}" class="alert alert-primary border-0 rounded-3 p-3 mb-4 text-start">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-card-text fs-5 text-primary"></i>
                    <span class="fw-bold text-dark small">Plan <span th:text="${plan}">Taller</span></span>
                </div>
                <span class="small text-muted d-block">Tu cuenta se activará cuando el administrador global apruebe el plan. Precio: <span class="fw-bold text-dark" th:text="'$ ' + ${precioPlan}">$50</span> /mes</span>
            </div>

            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 py-2 px-3 mb-3 d-flex align-items-center justify-content-center gap-2 small fw-semibold text-start" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/registro}" method="post" class="text-start">

                <input type="hidden" name="plan" th:value="${plan}">
                
                <div class="mb-3">
                    <label for="cedula" class="form-label fw-bold text-dark small">Cédula</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                        <input type="text" class="form-control" id="cedula" name="cedula" placeholder="Número de documento" required maxlength="20" pattern="[A-Za-z0-9-]+" title="Número de documento (letras y guiones permitidos)" th:value="${usuario.cedula}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold text-dark small">Nombre completo</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required maxlength="100" minlength="2" pattern="[A-Za-z0-9 áéíóúüñÁÉÍÓÚÜÑ.'-]+" title="Solo letras, números, espacios, apóstrofes y guiones" th:value="${usuario.nombre}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label fw-bold text-dark small">Usuario</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nombre de usuario" required maxlength="50" minlength="3" pattern="[A-Za-z0-9_.-]+" title="Solo letras, números, guiones bajos, guiones y puntos" th:value="${usuario.username}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold text-dark small">Correo electrónico</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required maxlength="100" th:value="${usuario.email}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label fw-bold text-dark small">Teléfono / WhatsApp</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Número de contacto" maxlength="20" pattern="[0-9+ ]+" title="Solo números, espacios y +" th:value="${usuario.telefono}">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold text-dark small">Contraseña</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required minlength="8" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="Mínimo 8 caracteres: mayúscula, minúscula, número y símbolo">
                    </div>
                    <div class="form-text small text-muted">Mínimo 8 caracteres. Debe incluir al menos una mayúscula, una minúscula, un número y un símbolo.</div>
                </div>

                <button type="submit" class="btn btn-accent w-100 fw-bold fs-6 mb-3">Registrarse</button>
            </form>

            <div class="mt-3 pt-3 border-top text-center">
                <a th:href="@{/login}" class="text-decoration-none small text-muted fw-semibold">
                    ¿Ya tienes cuenta? Inicia sesión aquí
                </a>
            </div>
        </div>
    </div>
<script th:src="@{/js/seguridad.js}"></script>
</body>
</html>
