<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Assembly - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card text-center">
            
            <div class="brand-logo">
                <i class="bi bi-bicycle"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Crea tu cuenta</h3>
            <p class="text-muted small mb-4">Únete a Bike Assembly</p>

            <form th:action="@{/registro}" method="post" class="text-start">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold text-dark small">Nombre completo</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold text-dark small">Correo electrónico</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold text-dark small">Contraseña</label>
                    <div class="input-group-custom d-flex align-items-center">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent w-100 fw-bold fs-6 mb-3">Registrarse</button>
            </form>

            <div class="mt-3 pt-3 border-top text-center">
                <a th:href="@{/login}" class="text-decoration-none small text-muted fw-semibold">
                    ¿Ya tienes cuenta? Inicia sesión aquí
                </a>
            </div>
        </div>
    </div>
</body>
</html>
